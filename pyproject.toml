[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homesched"
version = "0.1.0"
description = "Calendar- and presence-aware chore scheduling for a household robot"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "icalendar>=5.0"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
google = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "ruff>=0.4"]

[project.scripts]
homesched = "homesched.cli:main"

[tool.setuptools.packages.find]
include = ["homesched*"]

[tool.setuptools.package-data]
homesched = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
